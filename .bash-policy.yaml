rules:
  # Runtime allow rules. These shapes are exact policy identities used by the
  # evaluator after safe-path and rtk normalization.
  - kind: command-shape
    identity: gh pr view <number> --comments
    decision: allow
  - kind: command-shape
    identity: gh pr view <number> --json <fields>
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --cached -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff --cached <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git log --oneline -<number>
    decision: allow
  - kind: command-shape
    identity: git log --oneline -<number> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git stash list
    decision: allow
  - kind: command-shape
    identity: grep -n <safe-path>...
    decision: allow
  - kind: command-shape
    identity: head -<number>
    decision: allow
  - kind: command-shape
    identity: stacklit derive --ai-summary -i <safe-path>
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --cached --stat
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --stat
    decision: allow
  - kind: command-shape
    identity: git diff --staged -U<number> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff --stat HEAD
    decision: allow
  - kind: command-shape
    identity: git diff HEAD -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff HEAD --staged -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git grep -n -E <pattern> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git grep -n -i -e <pattern> -e <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git grep -n <pattern> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git ls-files --others --exclude-standard
    decision: allow
  - kind: command-shape
    identity: gofmt -d <safe-path>...
    decision: allow
  - kind: command-shape
    identity: gofmt -l <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -E <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -n -i <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -n <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -n <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -nE <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -v <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -vE <pattern>
    decision: allow
  - kind: command-shape
    identity: grep <pattern>
    decision: allow
  - kind: command-shape
    identity: head
    decision: allow
  - kind: command-shape
    identity: nl -ba <safe-path>
    decision: allow
  - kind: command-shape
    identity: sed -n <number>p <safe-path>...
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p <safe-path>...
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p;<number>,<number>p
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p;<number>,<number>p <safe-path>...
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p;<number>,<number>p;<number>,<number>p
    decision: allow
  - kind: command-shape
    identity: sort -t| -k<number> -rn
    decision: allow
  - kind: command-shape
    identity: tail -<number>
    decision: allow
  - kind: command-shape
    identity: wc -l
    decision: allow
  - kind: command-shape
    identity: xargs -r gofmt -l
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --cached --no-color -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --cached --no-color <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --no-color -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --no-color
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git check-ignore -v <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff --cached --shortstat
    decision: allow
  - kind: command-shape
    identity: git grep -nI -e <pattern> -e <pattern> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git grep -nI -e <pattern> -e <pattern> -e <pattern> -- <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git ls-files --cached <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git status --porcelain <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git status --short --untracked-files=all
    decision: allow
  - kind: command-shape
    identity: git status --short <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -A<number> -B<number> <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -i <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -iE <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -in <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -iv <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -nE -i <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -rn <pattern> --include=<safe-glob>
    decision: allow
  - kind: command-shape
    identity: grep -rn <pattern> --include=<safe-glob> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -q <pattern>
    decision: allow
  - kind: command-shape
    identity: grep <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: nl -ba
    decision: allow
  - kind: command-shape
    identity: rg -c <pattern> -i <safe-path>...
    decision: allow
  - kind: command-shape
    identity: rg -c <pattern>
    decision: allow
  - kind: command-shape
    identity: rg -l <pattern> --no-messages
    decision: allow
  - kind: command-shape
    identity: rg -n -g <pattern> <pattern> -l
    decision: allow
  - kind: command-shape
    identity: rg -n <pattern> --glob <pattern> -l
    decision: allow
  - kind: command-shape
    identity: rg -n <pattern> <safe-path> <safe-path> --no-ignore-vcs
    decision: allow
  - kind: command-shape
    identity: rg -o <pattern> -i <safe-path>...
    decision: allow
  - kind: command-shape
    identity: tail -n +<number>
    decision: allow
  - kind: command-shape
    identity: test -f <safe-path>
    decision: allow
  - kind: command-shape
    identity: "true"
    decision: allow

  # Export bookkeeping only. Resolved permission families suppress broad Claude
  # Bash(...) candidate noise; they do not authorize runtime commands.
  - kind: permission-family
    identity: Bash(/usr/bin/test:*)
    status: resolved
  - kind: permission-family
    identity: Bash(ast-grep:*)
    status: resolved
  - kind: permission-family
    identity: Bash(awk:*)
    status: resolved
